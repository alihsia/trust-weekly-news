<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>信託與資產傳承週報</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F5F6F3;
    --surface: #FFFFFF;
    --ink: #1D2622;
    --muted: #5E6B65;
    --green: #173B33;
    --green-soft: #E3E9E4;
    --brass: #A57F35;
    --rule: #D5DCD7;
    --serif: "Noto Serif TC", "PMingLiU", "Songti TC", serif;
    --sans: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.8;
  }
  a { color: var(--green); }
  a:focus-visible, button:focus-visible {
    outline: 2px solid var(--brass);
    outline-offset: 3px;
  }
  .wrap { max-width: 780px; margin: 0 auto; padding: 0 24px; }

  /* 刊頭 */
  .masthead { background: var(--green); color: #fff; padding: 44px 0 0; }
  .masthead h1 {
    font-family: var(--serif);
    font-size: clamp(30px, 6vw, 44px);
    font-weight: 700;
    letter-spacing: 0.08em;
    line-height: 1.3;
    margin: 0;
  }
  .masthead .rule { width: 72px; height: 3px; background: var(--brass); margin: 18px 0 14px; }
  .masthead .meta { color: #C9D6D0; font-size: 15px; margin: 0; }
  .masthead .note { color: #9FB3AA; font-size: 13px; margin: 4px 0 0; }

  /* 期別切換 */
  .issues { display: flex; gap: 4px; margin-top: 32px; overflow-x: auto; }
  .issues button {
    font: inherit;
    font-size: 14px;
    background: transparent;
    color: #C9D6D0;
    border: 0;
    border-bottom: 3px solid transparent;
    padding: 10px 16px 12px;
    cursor: pointer;
    white-space: nowrap;
  }
  .issues button:hover { color: #fff; }
  .issues button[aria-selected="true"] { color: #fff; border-bottom-color: var(--brass); font-weight: 700; }

  /* 主題目錄 */
  .toc { background: var(--surface); border-bottom: 1px solid var(--rule); }
  .toc .wrap { display: flex; gap: 20px; flex-wrap: wrap; padding-top: 12px; padding-bottom: 12px; font-size: 14px; }
  .toc a { color: var(--muted); text-decoration: none; }
  .toc a:hover { color: var(--green); text-decoration: underline; }
  .toc .count { color: var(--brass); margin-left: 4px; }

  main { padding: 40px 0 24px; }
  h2 {
    font-family: var(--serif);
    font-size: 24px;
    letter-spacing: 0.04em;
    margin: 56px 0 8px;
    padding-bottom: 10px;
    border-bottom: 2px solid var(--green);
  }
  h2:first-child { margin-top: 0; }

  /* 本週重點 */
  .highlights { list-style: none; margin: 0; padding: 0; }
  .highlights li { padding: 14px 0; border-bottom: 1px solid var(--rule); }
  .highlights .sec { display: block; font-size: 13px; color: var(--brass); font-weight: 500; }
  .highlights a { font-weight: 500; text-decoration: none; }
  .highlights a:hover { text-decoration: underline; }

  /* 新聞 */
  article { padding: 28px 0 32px; border-bottom: 1px solid var(--rule); scroll-margin-top: 16px; }
  article:last-child { border-bottom: 0; }
  .byline { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
  .tag { background: var(--green-soft); color: var(--green); padding: 1px 8px; border-radius: 2px; font-weight: 500; }
  article h3 { font-family: var(--serif); font-size: 21px; line-height: 1.5; margin: 10px 0 8px; }
  .lede { margin: 0 0 18px; padding-left: 14px; border-left: 3px solid var(--brass); color: var(--ink); font-weight: 500; }
  .triad { margin: 0; }
  .triad div { display: grid; grid-template-columns: 5.5em 1fr; gap: 12px; padding: 10px 0; }
  .triad div + div { border-top: 1px dashed var(--rule); }
  .triad dt { font-weight: 700; color: var(--green); font-size: 15px; }
  .triad dd { margin: 0; }
  .src { display: inline-block; margin-top: 12px; font-size: 14px; }

  .empty { color: var(--muted); padding: 20px 0; margin: 0; }

  /* 參考來源 */
  .refs { font-size: 14px; padding-left: 20px; margin: 12px 0 0; }
  .refs li { margin-bottom: 6px; }
  .refs span { color: var(--muted); }

  footer { border-top: 1px solid var(--rule); color: var(--muted); font-size: 13px; padding: 20px 0 48px; }
  .error { background: #fff; border-left: 4px solid #9B2C2C; padding: 16px 20px; }

  @media (max-width: 560px) {
    .wrap { padding: 0 18px; }
    .triad div { grid-template-columns: 1fr; gap: 2px; }
    article h3 { font-size: 19px; }
  }
</style>
</head>
<body>

<header class="masthead">
  <div class="wrap">
    <h1>信託與資產傳承週報</h1>
    <div class="rule"></div>
    <p class="meta" id="meta">載入中…</p>
    <p class="note" id="note"></p>
    <nav class="issues" id="issues" role="tablist" aria-label="選擇期別"></nav>
  </div>
</header>

<nav class="toc" aria-label="本期主題"><div class="wrap" id="toc"></div></nav>

<main><div class="wrap" id="content"></div></main>

<footer>
  <div class="wrap">
    本週報由 AI 彙整每週（週一至週日）公開新聞並經人工檢閱，僅供內部研究參考；引用前請點原文連結覆核。網站保留最近 4 期。
  </div>
</footer>

<script>
  const MAX_ISSUES = 4;
  const CN_NUM = ["一", "二", "三", "四", "五", "六"];
  const TRIAD = [["① 事件", "event"], ["② 創新", "innovation"], ["③ 影響", "impact"]];

  const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const short = p => p.split("–").map(x => x.trim().split("/").slice(1).map(Number).join("/")).join("–");

  let issues = [];

  fetch("data.json", { cache: "no-store" })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(data => {
      issues = (data.issues || [])
        .sort((a, b) => b.publish_date.localeCompare(a.publish_date))
        .slice(0, MAX_ISSUES);
      if (!issues.length) throw new Error("empty");
      const want = new URLSearchParams(location.search).get("issue");
      render(issues.find(i => i.id === want) || issues[0]);
    })
    .catch(() => {
      document.getElementById("meta").textContent = "";
      document.getElementById("content").innerHTML =
        `<div class="error"><strong>週報內容沒有載入。</strong><br>
        請用 GitHub Pages 網址開啟本頁；直接在電腦上雙擊 index.html 時，瀏覽器會阻擋讀取 data.json。
        若網址正確仍出現此訊息，請檢查 data.json 格式是否完整（可貼到 jsonlint.com 檢查）。</div>`;
    });

  function render(issue) {
    // 刊頭與期別
    document.getElementById("meta").textContent =
      `第 ${issue.issue_no} 期｜收錄 ${issue.period}`;
    document.getElementById("note").textContent = issue.note || "";
    document.getElementById("issues").innerHTML = issues.map(i =>
      `<button role="tab" aria-selected="${i.id === issue.id}" data-id="${esc(i.id)}">
         第 ${i.issue_no} 期 · ${short(i.period)}</button>`).join("");
    document.querySelectorAll("#issues button").forEach(b =>
      b.addEventListener("click", () => {
        const next = issues.find(i => i.id === b.dataset.id);
        history.replaceState(null, "", `?issue=${next.id}`);
        render(next);
        window.scrollTo(0, 0);
      }));

    const aid = id => `${issue.id}-${id}`;
    const all = issue.sections.flatMap(s => s.items.map(it => ({ ...it, section: s.title })));

    // 主題目錄
    document.getElementById("toc").innerHTML = issue.sections.map((s, n) =>
      `<a href="#${issue.id}-${s.key}">${CN_NUM[n]}、${esc(s.title)}<span class="count">${s.items.length}</span></a>`).join("");

    // 本週重點
    const hl = (issue.highlights || []).map(id => all.find(it => it.id === id)).filter(Boolean);
    let html = `<h2>本週重點</h2><ul class="highlights">` + hl.map(it =>
      `<li><span class="sec">${esc(it.section)}</span>
         <a href="#${aid(it.id)}">${esc(it.title)}</a></li>`).join("") + `</ul>`;

    // 四大主題
    issue.sections.forEach((s, n) => {
      html += `<h2 id="${issue.id}-${s.key}">${CN_NUM[n]}、${esc(s.title)}</h2>`;
      if (!s.items.length) { html += `<p class="empty">本週無重要動態。</p>`; return; }
      s.items.forEach(it => {
        html += `<article id="${aid(it.id)}">
          <div class="byline">${(it.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join("")}
            <span>${esc(it.date.replace(/-/g, "/"))}</span><span>${esc(it.source)}</span></div>
          <h3>${esc(it.title)}</h3>
          <p class="lede">${esc(it.summary)}</p>
          <dl class="triad">${TRIAD.map(([label, key]) =>
            `<div><dt>${label}</dt><dd>${esc(it[key])}</dd></div>`).join("")}</dl>
          <a class="src" href="${esc(it.url)}" target="_blank" rel="noopener">閱讀原文（${esc(it.source)}）</a>
        </article>`;
      });
    });

    // 參考來源
    html += `<h2>參考來源</h2><ol class="refs">` + all.map(it =>
      `<li><a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a>
         <span>（${esc(it.source)}，${esc(it.date)}）</span></li>`).join("") + `</ol>`;

    document.getElementById("content").innerHTML = html;
  }
</script>
</body>
</html>
